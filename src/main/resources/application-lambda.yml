# Active only under the "lambda" Spring profile (LambdaHandler passes it).
# DB creds, jwt.secret, jwt.refresh-secret and url.shortener.base-url are pulled from SSM Parameter Store at
# startup (baked into the SnapStart snapshot). SSM params live under /config/margdarshak/,
# e.g. /config/margdarshak/spring.datasource.password -> property spring.datasource.password.
spring:
  config:
    import: "optional:aws-parameterstore:/config/margdarshak/"
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-southeast-1}
  main:
    banner-mode: "off"
  api: /api/v1/
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: public
      # One connection per Lambda execution environment; the Neon pooler fans out across many.
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 8000
  # Schema changes are applied by hand (mvn liquibase:update) before a deploy; running them at
  # startup would make SnapStart's snapshot-time init depend on the DB.
  liquibase:
    enabled: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        # Explicit dialect + no metadata probe => cold start / snapshot never needs the DB.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false

# jwt.secret and jwt.refresh-secret come from SSM. Seconds: access 24h, refresh 7 days (rotated
# on every refresh, so only 7 days of inactivity forces a new login).
jwt:
  expiration: 86400
  refresh-expiration: 604800

url:
  shortener:
    base-url: ${URL_SHORTENER_BASE_URL:https://url.ajkumarray.com/}

app:
  # Where a bare link.ajkumarray.com hit with no code sends the visitor.
  default-redirect-url: ${APP_DEFAULT_REDIRECT_URL:https://url.ajkumarray.com/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
